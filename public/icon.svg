<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091A14"/>
      <stop offset="50%" stop-color="#0D201A"/>
      <stop offset="100%" stop-color="#06120E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#1F4D3E" stroke-width="6"/>

  <!-- Compass Needle / Mountain Peak background element -->
  <path d="M256 90 L310 180 L202 180 Z" fill="url(#emeraldGrad)" opacity="0.4"/>
  <path d="M256 120 L380 280 L132 280 Z" fill="#13362A" opacity="0.3"/>

  <!-- Distinctive "13" Numerals in Playfair / Serif Luxury Style -->
  <g fill="url(#goldGrad)" style="filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));">
    <!-- Number 1 -->
    <path d="M190 190 L225 160 L225 350 L190 350 L190 325 L200 325 L200 195 L180 210 Z" />
    <rect x="175" y="340" width="80" height="15" rx="3" />

    <!-- Number 3 -->
    <path d="M275 170 H335 L300 240 C325 242 345 260 345 290 C345 325 315 355 275 355 C250 355 235 342 230 330 L250 315 C255 324 263 330 275 330 C295 330 315 315 315 290 C315 265 295 255 270 255 H260 V235 H270 C290 235 305 225 305 205 C305 190 295 185 280 185 C268 185 258 192 252 200 L235 185 C245 174 258 170 275 170 Z" />
  </g>

  <!-- Brand Subtitle -->
  <text x="256" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="8" fill="#A7F3D0" text-anchor="middle">THIRTEEN</text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#6EE7B7" opacity="0.8" text-anchor="middle">OPERATOR TOUR</text>
</svg>
